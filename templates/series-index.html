<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SERIES TITLE --></title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --article-width: 740px; --body-font: 'Source Serif 4', Georgia, serif;
  --heading-font: 'Source Sans 3', system-ui, sans-serif;
  --mono-font: 'Source Code Pro', monospace; --body-size: 1.125rem; --line-height: 1.6;
  --text: #1a1a2e; --text-2: #4a4a6a; --accent: #2563eb; --accent-light: #dbeafe;
  --bg: #fafafa; --fig-bg: #ffffff; --border: #e2e2e8;
}
body { font-family: var(--body-font); font-size: var(--body-size); line-height: var(--line-height); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
.article { max-width: var(--article-width); margin: 0 auto; padding: 2rem 1.25rem 6rem; }
h1 { font-family: var(--heading-font); font-weight: 700; font-size: 2.5rem; line-height: 1.2; margin: 0 0 0.5rem; }
p { margin: 0 0 1rem; }
a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.card-list { display: flex; flex-direction: column; gap: 1rem; margin: 2.5rem 0; }
.card {
  display: grid; grid-template-columns: 80px 1fr; gap: 1.25rem;
  background: var(--fig-bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 1.25rem 1.5rem; text-decoration: none; transition: border-color 0.15s;
}
.card:hover { border-color: var(--accent); }
.card-thumb { width: 80px; height: 80px; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.card-thumb svg, .card-thumb canvas { width: 80px; height: 80px; }
.card-body { display: flex; flex-direction: column; justify-content: center; }
.card-number { font-family: var(--mono-font); font-size: 0.8rem; color: var(--text-2); }
.card-title { font-family: var(--heading-font); font-weight: 700; font-size: 1.2rem; color: var(--text); margin-bottom: 0.3rem; }
.card-desc { font-size: 0.95rem; color: var(--text-2); margin: 0; }
.card-tags { font-family: var(--heading-font); font-size: 0.75rem; color: var(--accent); margin-top: 0.5rem; }
@media (max-width: 640px) { h1 { font-size: 1.75rem; } .card { grid-template-columns: 1fr; } .card-thumb { display: none; } }
@media (prefers-color-scheme: dark) {
  :root { --text: #e8e6dd; --text-2: #a0a0b4; --bg: #1a1a2e; --fig-bg: #22223a; --border: #3a3a52; --accent: #60a5fa; --accent-light: #1e3a5f; }
}
</style>
</head>
<body>
<div class="article">
  <header>
    <h1><!-- SERIES TITLE --></h1>
    <p style="font-family: var(--heading-font); font-size: 1.15rem; color: var(--text-2);">
      <!-- SERIES SUBTITLE -->
    </p>
  </header>

  <!-- INTRO PARAGRAPHS -->

  <div class="card-list">
    <!-- ARTICLE CARDS -->
  </div>

  <footer style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border); font-family: var(--heading-font); font-size: 0.85rem; color: var(--text-2);">
    <p>Built with shine.</p>
  </footer>
</div>
</body>
</html>
